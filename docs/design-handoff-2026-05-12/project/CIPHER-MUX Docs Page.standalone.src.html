<body>

<template id="__bundler_thumbnail" data-bg-color="#F4F3ED">

    <!-- left: TOC sidebar mock -->
    <g>
      <rect x="120" y="200" width="240" height="500" fill="#FEFEFB" stroke="#C8C5B8" stroke-width="2"/>
      <text x="140" y="232" font-family="'Fira Code', monospace" font-size="11" letter-spacing="2" fill="#8A8A82">INHALT</text>
      <g font-family="'Rajdhani', system-ui, sans-serif" font-size="14" fill="#4A4A52">

        <text x="140" y="330">03 · Workspace</text>
        <text x="140" y="360">04 · Personas</text>
        <text x="140" y="390">05 · Cockpit</text>
        <text x="140" y="420">06 · Cyber Factory</text>
        <text x="140" y="450">07 · Grid</text>
        <text x="140" y="480">08 · Presets</text>

      <rect x="120" y="350" width="3" height="20" fill="#006B7A"/>

    <!-- right: page content mock -->
    <g>
      <rect x="400" y="200" width="680" height="500" fill="#FEFEFB" stroke="#C8C5B8" stroke-width="2"/>

      <text x="420" y="235" font-family="'Fira Code', monospace" font-size="11" letter-spacing="3" fill="#006B7A">KAPITEL 05</text>
      <!-- big heading -->
      <text x="420" y="285" font-family="'Rajdhani', system-ui, sans-serif" font-weight="700" font-size="36" fill="#1A1A1D">Das Cockpit</text>

    <rect x="120" y="740" width="960" height="2" fill="#006B7A"/>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="features-shared.jsx?v=3"></script>
<script type="text/babel" src="docs-shared.jsx?v=1"></script>
<script type="text/babel" src="docs-sections-1.jsx?v=1"></script>
<script type="text/babel" src="docs-sections-2.jsx?v=1"></script>
<script type="text/babel" src="docs-page.jsx?v=1"></script>

<script type="text/babel" data-presets="env,react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "luftig",
    "accent": "#4e9d3f",
    "showAnchorNav": true
  }/*EDITMODE-END*/;

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <DesignCanvas title="CIPHER-MUX — Docs / Handbuch">
          <DCSection id="full" title="Docs Page — Handbuch v0.9.9">
            <DCArtboard id="docs" label={`Docs · ${t.theme} · ${t.density}`} width={1200} height={7600}>
              <DocsPage theme={t.theme} density={t.density} accent={t.accent} showAnchorNav={t.showAnchorNav} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Theme">
            <TweakRadio label="Mode"
              value={t.theme}
              onChange={v => setTweak('theme', v)}
              options={[{label:'Light', value:'light'},{label:'Dark', value:'dark'}]} />
          </TweakSection>
          <TweakSection label="Layout">
            <TweakRadio label="Density"
              value={t.density}
              onChange={v => setTweak('density', v)}
              options={[{label:'Luftig', value:'luftig'},{label:'Dicht', value:'dicht'}]} />
            <TweakToggle label="Anchor-Nav rechts"
              value={t.showAnchorNav}
              onChange={v => setTweak('showAnchorNav', v)} />
          </TweakSection>
          <TweakSection label="Brand">
            <TweakColor label="Accent"
              value={t.accent}
              onChange={v => setTweak('accent', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
