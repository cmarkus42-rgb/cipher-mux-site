<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>CIPHER-MUX — Download &amp; First Steps (Design)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #1a1a1d; }
  body { font-family: 'Fira Code', monospace; color: #ECEFF4; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="features-shared.jsx?v=2"></script>
<script type="text/babel" src="install-sections.jsx?v=1"></script>
<script type="text/babel" src="install-page.jsx?v=1"></script>

<script type="text/babel" data-presets="env,react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "luftig",
    "accent": "#4e9d3f",
    "showAnchorNav": true
  }/*EDITMODE-END*/;

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <DesignCanvas title="CIPHER-MUX — Download & First Steps">
          <DCSection id="full" title="Install Page — Light + Dark">
            <DCArtboard id="install-light" label={`Install · Light · ${t.density}`} width={1200} height={3600}>
              <InstallPage theme="light" density={t.density} accent={t.accent} showAnchorNav={t.showAnchorNav} />
            </DCArtboard>
            <DCArtboard id="install-dark" label={`Install · Dark (Nord) · ${t.density}`} width={1200} height={3600}>
              <InstallPage theme="dark" density={t.density} accent={t.accent} showAnchorNav={t.showAnchorNav} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Layout">
            <TweakRadio label="Density"
              value={t.density}
              onChange={v => setTweak('density', v)}
              options={[{label:'Luftig', value:'luftig'},{label:'Dicht', value:'dicht'}]} />
            <TweakToggle label="Anchor-Nav rechts"
              value={t.showAnchorNav}
              onChange={v => setTweak('showAnchorNav', v)} />
          </TweakSection>
          <TweakSection label="Brand">
            <TweakColor label="Accent"
              value={t.accent}
              onChange={v => setTweak('accent', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
