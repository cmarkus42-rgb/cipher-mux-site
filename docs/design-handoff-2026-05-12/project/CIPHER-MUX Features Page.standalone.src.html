<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>CIPHER-MUX — Features (Design)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #1a1a1d; }
  body { font-family: 'Fira Code', monospace; color: #ECEFF4; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>

<template id="__bundler_thumbnail" data-bg-color="#F4F3ED">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <!-- backdrop -->
    <rect width="1200" height="800" fill="#F4F3ED"/>
    <!-- top frame line -->
    <rect x="80" y="80" width="1040" height="640" fill="none" stroke="#C8C5B8" stroke-width="2"/>
    <!-- 3x2 grid of cells (cockpit silhouette) -->
    <g stroke="#C8C5B8" stroke-width="2" fill="#FEFEFB">
      <rect x="120" y="160" width="300" height="240"/>
      <rect x="450" y="160" width="300" height="240"/>
      <rect x="780" y="160" width="300" height="240"/>
      <rect x="120" y="430" width="300" height="240"/>
      <rect x="450" y="430" width="300" height="240"/>
      <rect x="780" y="430" width="300" height="240"/>
    </g>
    <!-- accent dot top-left of each cell -->
    <g fill="#006B7A">
      <circle cx="140" cy="180" r="6"/>
      <circle cx="470" cy="180" r="6"/>
      <circle cx="800" cy="180" r="6"/>
      <circle cx="140" cy="450" r="6"/>
      <circle cx="470" cy="450" r="6"/>
      <circle cx="800" cy="450" r="6"/>
    </g>
    <!-- mock content lines per cell -->
    <g fill="#C8C5B8">
      <rect x="160" y="200" width="220" height="6"/><rect x="160" y="220" width="160" height="6"/>
      <rect x="490" y="200" width="220" height="6"/><rect x="490" y="220" width="180" height="6"/>
      <rect x="820" y="200" width="220" height="6"/><rect x="820" y="220" width="140" height="6"/>
      <rect x="160" y="470" width="220" height="6"/><rect x="160" y="490" width="170" height="6"/>
      <rect x="490" y="470" width="220" height="6"/><rect x="490" y="490" width="190" height="6"/>
      <rect x="820" y="470" width="220" height="6"/><rect x="820" y="490" width="150" height="6"/>
    </g>
    <!-- wordmark -->
    <g font-family="'Rajdhani', system-ui, sans-serif" font-weight="700" fill="#1A1A1D">
      <text x="120" y="130" font-size="28" letter-spacing="6">CIPHER-MUX</text>
    </g>
    <text x="990" y="130" font-family="'Fira Code', monospace" font-size="14" letter-spacing="2" fill="#8A8A82" text-anchor="end">FEATURES · DEEP-DIVE</text>
    <!-- bottom statusbar accent -->
    <rect x="80" y="710" width="1040" height="2" fill="#006B7A"/>
  </svg>
</template>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="features-shared.jsx?v=1"></script>
<script type="text/babel" src="features-sections.jsx?v=1"></script>
<script type="text/babel" src="features-page.jsx?v=1"></script>

<script type="text/babel" data-presets="env,react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "density": "luftig",
    "accent": "#4e9d3f",
    "showAnchorNav": true
  }/*EDITMODE-END*/;

  const App = () => {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <DesignCanvas title="CIPHER-MUX — Features (Deep-Dive)">
          <DCSection id="full" title="Full Features Page — Light + Dark">
            <DCArtboard id="features-light" label={`Features · Light · ${t.density}`} width={1200} height={4400}>
              <FeaturesPage theme="light" density={t.density} accent={t.accent} showAnchorNav={t.showAnchorNav} />
            </DCArtboard>
            <DCArtboard id="features-dark" label={`Features · Dark (Nord) · ${t.density}`} width={1200} height={4400}>
              <FeaturesPage theme="dark" density={t.density} accent={t.accent} showAnchorNav={t.showAnchorNav} />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel>
          <TweakSection label="Layout">
            <TweakRadio label="Density"
              value={t.density}
              onChange={v => setTweak('density', v)}
              options={[{label:'Luftig', value:'luftig'},{label:'Dicht', value:'dicht'}]} />
            <TweakToggle label="Anchor-Nav rechts"
              value={t.showAnchorNav}
              onChange={v => setTweak('showAnchorNav', v)} />
          </TweakSection>
          <TweakSection label="Brand">
            <TweakColor label="Accent"
              value={t.accent}
              onChange={v => setTweak('accent', v)} />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
