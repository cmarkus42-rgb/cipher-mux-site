<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CIPHER-MUX — Website Design</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #root { width: 100%; height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx?v=5"></script>
<script type="text/babel" src="artboards.jsx?v=5"></script>

<script type="text/babel" data-presets="env,react">
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "heroVariant": "schematic",
    "pillarVariant": "preset",
    "footerVariant": "plain",
    "accent": "#006B7A"
  }/*EDITMODE-END*/;

  function App() {
    const [tweaks, setTweak] = useTweaks(TWEAKS);

    // Live accent override
    React.useEffect(() => {
      const id = 'cm-accent-override';
      let s = document.getElementById(id);
      if (!s) { s = document.createElement('style'); s.id = id; document.head.appendChild(s); }
      s.textContent = `.cm-light { --accent: ${tweaks.accent}; --accent-light: ${tweaks.accent}; }`;
    }, [tweaks.accent]);

    const HV = tweaks.heroVariant, PV = tweaks.pillarVariant, FV = tweaks.footerVariant;

    return (
      <>
        <DesignCanvas>
          {/* ── PRIMARY: full landing pages ───────────────────────────── */}
          <DCSection id="full" title="Full Landing — Light + Dark" subtitle="Side-by-side wie im aktuellen Mockup. Tweaks oben rechts wechseln Hero / Pillars / Footer-Variante.">
            <DCArtboard id="full-light" label="Light · Cipher-Ivory · Default" width={1100} height={1500}>
              <FullLanding theme="light" heroVariant={HV} pillarVariant={PV} footerVariant={FV} />
            </DCArtboard>
            <DCArtboard id="full-dark" label="Dark · Nord" width={1100} height={1500}>
              <FullLanding theme="dark" heroVariant={HV} pillarVariant={PV} footerVariant={FV} />
            </DCArtboard>
          </DCSection>

          {/* ── HERO VARIANTS ─────────────────────────────────────────── */}
          <DCSection id="heroes" title="Hero — 3 Varianten" subtitle="A: Pixel-Grid (Mockup) · B: ASCII-Terminal Hintergrund (subtil) · C: Schematisches Grid-Cockpit (zwei-spaltig).">
            <DCArtboard id="hero-a" label="A · Pixel-Grid (baseline)" width={900} height={620}>
              <HeroOnly theme="light" variant="pixel" />
            </DCArtboard>
            <DCArtboard id="hero-b" label="B · ASCII Terminal Mock" width={900} height={620}>
              <HeroOnly theme="light" variant="terminal" />
            </DCArtboard>
            <DCArtboard id="hero-c" label="C · Schematisches Grid-Cockpit" width={900} height={620}>
              <HeroOnly theme="light" variant="schematic" />
            </DCArtboard>
            <DCArtboard id="hero-b-dark" label="B · ASCII · Dark Nord" width={900} height={620}>
              <HeroOnly theme="dark" variant="terminal" />
            </DCArtboard>
            <DCArtboard id="hero-c-dark" label="C · Schematic · Dark Nord" width={900} height={620}>
              <HeroOnly theme="dark" variant="schematic" />
            </DCArtboard>
          </DCSection>

          {/* ── PILLAR VARIANTS ───────────────────────────────────────── */}
          <DCSection id="pillars" title="Pillars — 3 Varianten" subtitle="A: 5×5 Pixel-Patterns wie im Mockup · B: Preset-Farb-Marker (lifted aus der App-UI) · C: Numbered minimal, ohne Icon.">
            <DCArtboard id="pil-a" label="A · Pixel-Patterns" width={900} height={460}>
              <PillarsOnly theme="light" variant="pixel" />
            </DCArtboard>
            <DCArtboard id="pil-b" label="B · Preset-Farb-Marker" width={900} height={460}>
              <PillarsOnly theme="light" variant="preset" />
            </DCArtboard>
            <DCArtboard id="pil-c" label="C · Numbered minimal" width={900} height={460}>
              <PillarsOnly theme="light" variant="minimal" />
            </DCArtboard>
            <DCArtboard id="pil-b-dark" label="B · Preset · Dark" width={900} height={460}>
              <PillarsOnly theme="dark" variant="preset" />
            </DCArtboard>
          </DCSection>

          {/* ── FOOTER VARIANTS ───────────────────────────────────────── */}
          <DCSection id="footer" title="Footer — 2 Varianten" subtitle="Plain: klassischer Website-Footer · Statusbar: wie die echte App-Leiste mit OFF/STT/COM Toggles und Versions-Pill.">
            <DCArtboard id="ft-a" label="A · Plain" width={900} height={300}>
              <FooterOnly theme="light" variant="plain" />
            </DCArtboard>
            <DCArtboard id="ft-b" label="B · Statusbar (App-flavour)" width={900} height={300}>
              <FooterOnly theme="light" variant="statusbar" />
            </DCArtboard>
            <DCArtboard id="ft-b-dark" label="B · Statusbar · Dark" width={900} height={300}>
              <FooterOnly theme="dark" variant="statusbar" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        <TweaksPanel title="Tweaks">
          <TweakSection title="Hero">
            <TweakRadio
              label="Variante"
              value={tweaks.heroVariant}
              options={[
                { value: 'pixel', label: 'Pixel' },
                { value: 'terminal', label: 'Terminal' },
                { value: 'schematic', label: 'Schematic' },
              ]}
              onChange={v => setTweak('heroVariant', v)}
            />
          </TweakSection>

          <TweakSection title="Pillars">
            <TweakRadio
              label="Variante"
              value={tweaks.pillarVariant}
              options={[
                { value: 'pixel', label: 'Pixel' },
                { value: 'preset', label: 'Preset' },
                { value: 'minimal', label: 'Numbered' },
              ]}
              onChange={v => setTweak('pillarVariant', v)}
            />
          </TweakSection>

          <TweakSection title="Footer">
            <TweakRadio
              label="Variante"
              value={tweaks.footerVariant}
              options={[
                { value: 'plain', label: 'Plain' },
                { value: 'statusbar', label: 'Statusbar' },
              ]}
              onChange={v => setTweak('footerVariant', v)}
            />
          </TweakSection>

          <TweakSection title="Brand">
            <TweakColor
              label="Accent (Light)"
              value={tweaks.accent}
              onChange={v => setTweak('accent', v)}
            />
          </TweakSection>
        </TweaksPanel>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
